<title>Tradingbots</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">

<style>
html,body{margin:0;height:100%;background:#1a1a1a;color:#fff;font-family:Arial,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:#2d2d2d;border:1px solid #404040;border-radius:10px;padding:24px;width:100%;max-width:340px;box-sizing:border-box}
.card h1{font-size:18px;margin:0 0 18px}
.card label{display:block;font-size:13px;color:#ccc;margin-bottom:6px}
.card input[type=password]{width:100%;box-sizing:border-box;padding:10px;border-radius:6px;border:1px solid #555;background:#1a1a1a;color:#fff;font-size:16px}
.card .row{display:flex;align-items:center;gap:8px;margin:12px 0 16px}
.card button{width:100%;padding:10px;border:0;border-radius:6px;background:#1e631e;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
.card button:disabled{opacity:.6;cursor:default}
.err{color:#ff6666;font-size:13px;min-height:18px;margin-top:10px}
#wait{color:#888;font-size:13px;text-align:center}
[hidden]{display:none !important}
</style></head><body>
<div class="wrap">
  <div id="wait">Déchiffrement…</div>
  <form id="lock" class="card" hidden>
    <h1>🔒 Tradingbots</h1>
    <label for="pw">Phrase de passe</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="row"><input id="remember" type="checkbox" checked> Se souvenir sur cet appareil</label>
    <button id="go" type="submit">Déverrouiller</button>
    <div id="err" class="err" role="alert"></div>
  </form>
</div>
<script>
(function () {
  var P = {"v": 1, "iter": 600000, "salt": "2gqt1mtWV2gsplrLjl0fSg==", "iv": "v+XfcW2aTuu9rYMI", "ct": "EktvLGbe1tMio7FfNFzDgJGS6S5dnxq4ySfxuYl4YM6WrbeAn3MsOW/JDKSY5e21LU4tYEvxOGmXDEYKOUW0NbBlSlpDJUjOXuaEamcoBREZvreB7vR0PqVdI97T+I5sZdtequPaetf2ahNXfAUX7KwOYUtwWObKElAt349Fpy81brDpidf0Sr8ZvOepW8uFKUIJAgQ7i/+CmP0G0vzbA+8EpzXsMRUp7CwOrGa40ANJKSDHJLdhlPkXTdAJUo95+BlQXnJzcpdf7K679k0qWVlSOpJHHqdtV41gYJk37qma7+gl3uO24r3LCQfavR47Iapmr0njG1m3btRt2LMyzcJ6wC/8z4jYzHwAGy6XfG/vWqR5gQQHQIpYpMrfG9P+di83lqSztn8uZu8kP7RES7voH8DRyCqTBkAjdZvyzyLxrJ5Fz1sgoiTfnX8REabZNuvlOMwJTAeneHZfX/xBllCLIk2fbJKZ1rZUNh6MKxHcOSYXPghdZKVVPVbNW/pmtqusA8gLBE0OITn4B1ylXJKDyr6Z4FkvIP3+GevIWgo8nPK7x1vaS8L25uwXQY97YFCi8qEmhZI1qBsJ08OMWBOnsKq7z4vQn9T1XUh+D12E39EqLXQKoSpyk4vNjradgjOLNPSxBomWc8qSh87kF4Y7Vm+CvH1zcFwdvqayPFfVZoAkXKrgfCBGkDvn939Owi9lvNx/zyww4C3g2+kJlguAA/0uoYF6YZDg5pNg4i+2VeE+YLIUQlDGSpi9nCK7+AhUXXe35MVqeO9FNCUyztHSosOwtO3yPB/YFOLHRm93ZtJk5tO7aRF/OKj3osdXnqRqGHg9AGoRkkO76seWSTFQJLGF/J0sRxXstQmzgsezDwLosznzF88WFcYTc4laYem+9uGRujj3CUBL6iG+PQ+9kPCM35urxqMAdp0Ex+kxZ/B7+z0/2Kb77erttzxr46GRcGqO9VYAj9x8w8kSF5DuPU1wgkiiIw7d32ZLYsCqzGkkPip4C07uO2pMUQxjnqVXWxB1btQaCqZlG4Q9oDNxqLBa5dJ+pYF69Yv7u+ElURfm9dcHO5Kaz9S1F8YLcSUr5jtCueJfknjHEYwzRy+1FX1I5yseb7UoXZdV02pjcTAMxyPAlGDWXj4TG4NqPI7Ep38TpVIdUjFOGSutHeUHiKuqTvJ96OAx8UGUvuOJoNC/ToOILjBgbhgYbFbmoOPZ09vpxLQCdzwehZlXP5tzL/79opRG8pI6mVplOsr87fIKrTf22o3esOxbLIZMNQ4+vUc7BKDAPh0N8diV1VstteLxNGImvHX0y19WKfM08sXATUFh/CGCPzvSoldsZdDDkpGPcPquk9wwmLWOSEAZ7rHQtVwyLNFLAtvjVp5nKzBRMWLsJ7Zq1GvTacuVhp0BkX095+Q7UbdPqINA150TbdoJph3RYmHgtuabVBeH4chMSSGh7Gfv217VtftYxpJci67M0rTNvAulOqx3IdPxkjed7TtYTDlrxE0pQv7rgMxS4MNVm2Uq3pl7mYrr/3AgD7WfgbknRv6CpYzKr6AGMPz3DNpjUVD9uJt7sN6v3mX1GAr2Ydpon06kqb3sd3ofvjIBHCCTeUsG6g=="};
  var STORE = 'unified-scanner-key';
  function el(id) { return document.getElementById(id); }
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function stored() { try { return localStorage.getItem(STORE) || sessionStorage.getItem(STORE); } catch (e) { return null; } }
  function forget() { try { localStorage.removeItem(STORE); sessionStorage.removeItem(STORE); } catch (e) {} }
  function keep(raw, remember) {
    forget();
    try { (remember ? localStorage : sessionStorage).setItem(STORE, b64e(raw)); } catch (e) {}
  }
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(P.salt), iterations: P.iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function decryptPage(raw) {
    var key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
    var zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.iv) }, key, b64d(P.ct));
    var stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask(msg) {
    el('wait').hidden = true;
    el('lock').hidden = false;
    el('err').textContent = msg || '';
    el('pw').focus();
  }
  el('lock').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var go = el('go');
    go.disabled = true;
    go.textContent = 'Vérification…';
    el('err').textContent = '';
    var raw, html;
    try {
      raw = await derive(el('pw').value);
      html = await decryptPage(raw);
    } catch (e) {
      go.disabled = false;
      go.textContent = 'Déverrouiller';
      el('err').textContent = 'Phrase de passe incorrecte.';
      el('pw').select();
      return;
    }
    keep(raw, el('remember').checked);
    show(html);
  });
  (async function () {
    if (!window.crypto || !crypto.subtle) { el('wait').textContent = 'Ouvre cette page en HTTPS pour la déchiffrer.'; return; }
    if (typeof DecompressionStream === 'undefined') { el('wait').textContent = 'Navigateur trop ancien : mets-le à jour pour afficher le scanner.'; return; }
    var s = stored();
    if (s) {
      try { show(await decryptPage(b64d(s))); return; }
      catch (e) { forget(); ask('La phrase de passe a changé : saisis-la à nouveau.'); return; }
    }
    ask('');
  })();
})();
</script>
