    try { (remember ? localStorage : sessionStorage).setItem(STORE, b64e(raw)); } catch (e) {}
  }
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(P.salt), iterations: P.iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function decryptPage(raw) {
    var key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
    var zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.iv) }, key, b64d(P.ct));
    var stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask(msg) {
    el('wait').hidden = true;
    el('lock').hidden = false;
    el('err').textContent = msg || '';
    el('pw').focus();
  }
  el('lock').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var go = el('go');
    go.disabled = true;
    go.textContent = 'Vérification…';
    el('err').textContent = '';
    var raw, html;
    try {
      raw = await derive(el('pw').value);
      html = await decryptPage(raw);
    } catch (e) {
      go.disabled = false;
      go.textContent = 'Déverrouiller';
      el('err').textContent = 'Phrase de passe incorrecte.';
      el('pw').select();
      return;
    }
    keep(raw, el('remember').checked);
    show(html);
  });
  (async function () {
    if (!window.crypto || !crypto.subtle) { el('wait').textContent = 'Ouvre cette page en HTTPS pour la déchiffrer.'; return; }
    if (typeof DecompressionStream === 'undefined') { el('wait').textContent = 'Navigateur trop ancien : mets-le à jour pour afficher le scanner.'; return; }
    var s = stored();
    if (s) {
      try { show(await decryptPage(b64d(s))); return; }
      catch (e) { forget(); ask('La phrase de passe a changé : saisis-la à nouveau.'); return; }
    }
    ask('');
  })();
})();
</script>
